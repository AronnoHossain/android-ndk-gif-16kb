apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    compileSdkVersion 34
    namespace 'com.waynejo.androidndkgif'

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        
        consumerProguardFiles 'consumer-rules.pro'
        
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        cmake {
            path "jni/CMakeLists.txt"
            version "3.22.1"
        }
    }

    // Tell the Android plugin to create a publication for the "release" build variant.
    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

publishing {
    publications {
        // This publication is now automatically linked to the "release" variant by the
        // android.publishing block above.
        release(MavenPublication) {
            groupId = 'com.github.AronnoHossain'
            artifactId = 'android-ndk-gif-16kb'
            // The version will be taken from the Git tag by JitPack
            version = '1.0.0'
        }
    }
    repositories {
        mavenLocal()
    }
}
