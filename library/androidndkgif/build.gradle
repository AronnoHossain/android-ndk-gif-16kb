apply plugin: 'com.android.library'

android {
    compileSdkVersion 34
    namespace 'com.waynejo.androidndkgif'

    defaultConfig {
        minSdkVersion 9
        targetSdkVersion 34
        
        consumerProguardFiles 'consumer-rules.pro'
        
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path "jni/CMakeLists.txt"
            version "3.22.1"
        }
    }
}
