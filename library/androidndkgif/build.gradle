apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    compileSdkVersion 35
    namespace 'com.waynejo.androidndkgif'

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            jni.srcDirs = ['jni']
        }
    }

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 35
        
        consumerProguardFiles 'consumer-rules.pro'
        
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                arguments += ["-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"]
            }
        }
    }

    compileOptions {
        // Enable core library desugaring to use Java 17 features on older Android versions.
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path "jni/CMakeLists.txt"
            version "3.22.1"
        }
    }

    // This block tells AGP to prepare the 'release' variant for publishing.
    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

// Use afterEvaluate to ensure the Android components are created before we try to use them.
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = 'com.github.AronnoHossain'
                artifactId = 'android-ndk-gif-16kb'
                // The version will be taken from the Git tag by JitPack.
                version = '1.1.0'
            }
        }
        repositories {
            mavenLocal()
        }
    }
}
